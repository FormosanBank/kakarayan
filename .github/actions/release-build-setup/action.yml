name: Prepare a release build
description: Check out the pinned FormosanBank source, the publication inputs, and locked dependencies.

inputs:
  source_commit:
    description: Public FormosanBank commit to build
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: "3.13"

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        enable-cache: true

    - name: Check out the exact public FormosanBank source
      shell: bash
      env:
        SOURCE_COMMIT: ${{ inputs.source_commit }}
      run: |
        git init -q build/formosanbank
        git -C build/formosanbank remote add origin \
          https://github.com/FormosanBank/FormosanBank.git
        git -C build/formosanbank fetch --depth=1 origin "$SOURCE_COMMIT"
        git -C build/formosanbank checkout --detach FETCH_HEAD

    - name: Download immutable publication inputs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: publication-inputs-${{ github.run_id }}
        path: build/publication-inputs

    - name: Install locked dependencies
      shell: bash
      run: uv sync --locked --all-groups
