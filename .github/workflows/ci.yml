name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Publisher and query API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check format, lint, and types
        run: |
          uv run ruff format --check api publisher
          uv run ruff check .
          uv run mypy api publisher

      - name: Run publisher and API tests
        run: uv run pytest api/tests publisher/tests

      - name: Audit Python dependencies
        run: uv run pip-audit --local --progress-spinner=off

      - name: Build the query API container
        run: docker build --file api/Dockerfile .

  site:
    name: Site, contract journey, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_KAKARAYAN_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          npm ci --prefix site

      - name: Build the invented fixture release
        run: |
          uv run python -m publisher.fixture_cli --output build/fixture-release
          uv run python -m publisher.verify_release --release build/fixture-release
          uv run python -m publisher.assemble_site \
            --release build/fixture-release \
            --public site/public

      - name: Test and build the site
        run: |
          npm --prefix site audit --audit-level=high
          npm --prefix site run lint
          npm --prefix site run typecheck
          npm --prefix site test
          npm --prefix site run build
          uv run python -m publisher.verify_site --site site/dist

      - name: Install browser engines
        working-directory: site
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run browser journey and accessibility checks
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            npm --prefix site run test:e2e
          else
            npm --prefix site run test:e2e -- --project=desktop-chromium
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Detect dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api \
            "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" \
            >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency review skipped because the repository dependency graph is unavailable."
          fi

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
