name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Publisher and query API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check format, lint, and types
        run: |
          uv run ruff format --check api publisher
          uv run ruff check .
          uv run mypy api publisher

      - name: Run publisher and API tests
        run: uv run pytest api/tests publisher/tests

      - name: Audit Python dependencies
        run: uv run pip-audit --local --progress-spinner=off

      - name: Build the query API container
        run: |
          docker build --file api/Dockerfile --build-arg KAKARAYAN_COMMIT="$GITHUB_SHA" --tag "kakarayan-api:$GITHUB_SHA" .
          uv run python -m publisher.fixture_cli --output build/container-fixture
          docker run -d --name query-image-test -p 127.0.0.1:8001:7860 \
            -v "$PWD/build/container-fixture:/data:ro" \
            -e KAKARAYAN_DB_PATH=/data/formosanbank.sqlite \
            -e KAKARAYAN_RELEASE_MANIFEST_PATH=/data/release-manifest.json \
            "kakarayan-api:$GITHUB_SHA"
          trap 'docker logs query-image-test; docker rm -f query-image-test' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8001/readyz
          mkdir -p build/ci-image
          docker save "kakarayan-api:$GITHUB_SHA" | gzip -1 > build/ci-image/api-image.tar.gz
          docker inspect "kakarayan-api:$GITHUB_SHA" --format '{{.Id}}' > build/ci-image/image-id.txt
          cd build/ci-image
          sha256sum api-image.tar.gz image-id.txt > SHA256SUMS

      - name: Retain the tested API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-image-${{ github.sha }}
          path: build/ci-image/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Validate the Lightsail service definition
        env:
          KAKARAYAN_HOSTNAME: 203-0-113-10.sslip.io
          KAKARAYAN_CORS_ORIGINS: https://formosanbank.github.io
          KAKARAYAN_API_IMAGE: kakarayan-api:test
        run: docker compose --file deploy/lightsail/compose.yaml config --quiet

  site:
    name: Site, contract journey, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_KAKARAYAN_API_URL: http://127.0.0.1:8000
      KAKARAYAN_PERFORMANCE: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          npm ci --prefix site

      - name: Build the invented fixture release
        run: |
          uv run python -m publisher.fixture_cli --output build/fixture-release --include-prepared
          uv run python -m publisher.verify_release --release build/fixture-release
          uv run python -m publisher.assemble_site \
            --release build/fixture-release \
            --public site/public

      - name: Test and build the site
        run: |
          npm --prefix site audit --audit-level=high
          npm --prefix site run lint
          npm --prefix site run typecheck
          git diff --exit-code -- site/src/contractTypes.d.ts
          npm --prefix site test
          npm --prefix site run build
          uv run python -m publisher.verify_site --site site/dist

      - name: Install browser engines
        working-directory: site
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run browser journey and accessibility checks
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            npm --prefix site run test:e2e
          else
            npm --prefix site run test:e2e -- --project=desktop-chromium
          fi

      - name: Retain browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Detect dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api \
            "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" \
            >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency review skipped because the repository dependency graph is unavailable."
          fi

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
