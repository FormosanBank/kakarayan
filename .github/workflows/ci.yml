name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python, publisher, API, and legacy app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: kakarayan
          POSTGRES_PASSWORD: kakarayan
          POSTGRES_DB: kakarayan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kakarayan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kakarayan:kakarayan@127.0.0.1:5432/kakarayan
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting and lint
        run: |
          uv run ruff format --check corpus config publisher
          uv run ruff check .

      - name: Check Python types
        run: uv run mypy corpus config publisher api clients/python/kakarayan_client

      - name: Run the complete Python test suite
        run: uv run pytest

      - name: Build the API container
        run: docker build --file api/Dockerfile api

  site:
    name: Static site, accessibility, and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked --all-groups
          npm ci --prefix site

      - name: Build invented fixture data
        run: |
          uv run python -m publisher.fixture_cli --output build/fixture-release
          uv run python -m publisher.verify_release --release build/fixture-release
          uv run python -m publisher.assemble_site \
            --release build/fixture-release \
            --public site/public

      - name: Test and build the site
        run: |
          npm --prefix site audit --audit-level=high
          npm --prefix site run lint
          npm --prefix site run typecheck
          npm --prefix site test
          npm --prefix site run build
          uv run python -m publisher.verify_site --site site/dist

      - name: Install supported browsers
        working-directory: site
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser, mobile, and accessibility checks
        run: npm --prefix site run test:e2e

  clients:
    name: JavaScript, Python, and R clients
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            clients/javascript/package-lock.json

      - name: Set up R
        uses: r-lib/actions/setup-r@929c772977a3a13c8733b363bf5a2f685c25dd91

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@929c772977a3a13c8733b363bf5a2f685c25dd91
        with:
          working-directory: clients/R

      - name: Install locked Python and Node dependencies
        run: |
          uv sync --locked --all-groups
          npm ci --prefix site
          npm ci --prefix clients/javascript

      - name: Test JavaScript client
        run: |
          npm --prefix clients/javascript test
          npm --prefix clients/javascript run build

      - name: Test and build Python client
        run: |
          uv run pytest clients/python/tests
          uv build clients/python --out-dir build/python-client

      - name: Check R client
        run: |
          R CMD build clients/R
          R CMD check --no-manual --no-build-vignettes kakarayan_*.tar.gz

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Detect dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api \
            "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" \
            >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency review skipped because the repository dependency graph is unavailable."
          fi

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
