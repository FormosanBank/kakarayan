name: Deploy the query API

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Published data release the API should serve
        required: true
        type: string
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string

concurrency:
  group: query-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the tested image and data release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    environment:
      name: production
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Find the image tested by main CI
        id: ci
        run: |
          if [[ ! "$RELEASE_ID" =~ ^fb-[0-9]{8}-[0-9a-f]{7,12}$ ]]; then
            echo "An exact published release ID is required."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/data-$RELEASE_ID" \
            --jq '.draft == false' | grep -qx true
          echo "run=$(python -m publisher.github_release \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Download and verify the image
        run: |
          gh run download "${{ steps.ci.outputs.run }}" --repo "$GITHUB_REPOSITORY" \
            --name "api-image-$GITHUB_SHA" --dir build/image
          cd build/image
          sha256sum --check SHA256SUMS

      - name: Deploy over the restricted key
        env:
          DEPLOY_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "ubuntu@$HOST" "deploy $GITHUB_SHA $RELEASE_ID" \
            < build/image/api-image.tar.gz
