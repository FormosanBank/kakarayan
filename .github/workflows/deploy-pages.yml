name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "content/**"
      - "LICENSE"
      - "LICENSE.md"
      - "publisher/assemble_site.py"
      - "publisher/extract_metadata.py"
      - "publisher/verify_site.py"
      - "schemas/**"
      - "site/**"
  workflow_dispatch:
    inputs:
      release_id:
        description: Published Kakarayan data release ID; blank uses the latest compatible release
        required: false
        default: ""
        type: string

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve published release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      available: ${{ steps.release.outputs.available }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_RELEASE: ${{ inputs.release_id || '' }}
    steps:
      - name: Select a compatible published data release
        id: release
        shell: bash
        run: |
          if [[ -n "$REQUESTED_RELEASE" ]]; then
            if [[ ! "$REQUESTED_RELEASE" =~ ^fb-[0-9]{8}-[0-9a-f]{7,12}$ ]]; then
              echo "Invalid Kakarayan data release ID."
              exit 1
            fi
            TAG="data-$REQUESTED_RELEASE"
          else
            TAG="$(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
                [
                  .[]
                  | select(.draft == false and .prerelease == false)
                  | select(.tag_name | startswith("data-"))
                  | select(any(.assets[]; .name == "site-metadata.zip"))
                ]
                | sort_by(.published_at)
                | last
                | .tag_name // ""
              '
            )"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::warning::No published data release contains site-metadata.zip yet."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          if [[ "$(jq -r .draft "$RUNNER_TEMP/release.json")" != "false" ]] \
            || [[ "$(jq -r .prerelease "$RUNNER_TEMP/release.json")" != "false" ]]; then
            echo "The selected data release must be published and non-prerelease."
            exit 1
          fi
          if [[ "$(jq '[.assets[].name == "site-metadata.zip"] | any' "$RUNNER_TEMP/release.json")" != "true" ]]; then
            echo "$TAG does not contain site-metadata.zip."
            exit 1
          fi
          RELEASE_ID="${TAG#data-}"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Selected $TAG"

  build:
    name: Assemble and validate the production site
    if: ${{ needs.resolve.outputs.available == 'true' }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      VITE_KAKARAYAN_API_URL: ${{ vars.KAKARAYAN_API_URL }}
      VITE_KAKARAYAN_BUILD_ID: ${{ github.sha }}
      PLAYWRIGHT_API_MODE: remote
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Require approved deployment configuration
        shell: bash
        run: |
          if [[ ! -f LICENSE && ! -f LICENSE.md ]]; then
            echo "Production deployment requires the approved software license."
            exit 1
          fi
          if [[ ! "$VITE_KAKARAYAN_API_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Configure the KAKARAYAN_API_URL repository variable with the HTTPS query API base URL."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          npm ci --prefix site

      - name: Download the published metadata package
        run: |
          mkdir -p build/published-release
          gh release download "$RELEASE_TAG" \
            --pattern release-manifest.json \
            --pattern site-metadata.zip \
            --dir build/published-release

      - name: Verify and assemble the published site data
        run: |
          uv run python -m publisher.extract_metadata \
            --manifest build/published-release/release-manifest.json \
            --archive build/published-release/site-metadata.zip \
            --output build/site-release
          uv run python -m publisher.assemble_site \
            --release build/site-release \
            --public site/public \
            --download-manifest build/published-release/release-manifest.json

      - name: Require the matching query release
        shell: bash
        run: |
          READY="$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            "$VITE_KAKARAYAN_API_URL/readyz")"
          if [[ "$(jq -r .release_id <<<"$READY")" != "$RELEASE_ID" ]]; then
            echo "The query service is not serving $RELEASE_ID. Deploy it before Pages."
            exit 1
          fi

      - name: Build and verify the production site
        run: |
          npm --prefix site run build
          uv run python -m publisher.verify_site --site site/dist

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run production smoke and accessibility checks
        run: npm --prefix site run test:e2e -- --project=desktop-chromium --grep @production-smoke

      - name: Record deployed revisions
        run: |
          echo "Kakarayan application commit: $(git rev-parse HEAD)"
          echo "Data release: $RELEASE_TAG"
          jq '{release_id, source, kakarayan, counts}' \
            build/published-release/release-manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist

  deploy:
    name: Publish GitHub Pages
    if: ${{ needs.resolve.outputs.available == 'true' }}
    needs:
      - resolve
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
