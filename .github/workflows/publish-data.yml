name: Build and publish a data release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Public FormosanBank branch, tag, or commit
        required: true
        default: main
        type: string
      dry_run:
        description: Build and validate without creating a GitHub release
        required: true
        default: true
        type: boolean
      verify_determinism:
        description: Repeat the complete build and compare manifests
        required: true
        default: false
        type: boolean

concurrency:
  group: formosanbank-data-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve immutable publication inputs
    if: inputs.dry_run || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      release_id: ${{ steps.source.outputs.release_id }}
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate the public source ref
        shell: bash
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] \
            || [[ "$SOURCE_REF" == -* ]] \
            || [[ "$SOURCE_REF" == *".."* ]] \
            || [[ "$SOURCE_REF" == *"@{"* ]]; then
            echo "Invalid FormosanBank source ref."
            exit 1
          fi

      - name: Resolve the exact public FormosanBank source
        id: source
        shell: bash
        run: |
          git init -q build/formosanbank
          git -C build/formosanbank remote add origin \
            https://github.com/FormosanBank/FormosanBank.git
          git -C build/formosanbank fetch --depth=1 origin "$SOURCE_REF"
          SOURCE_COMMIT="$(git -C build/formosanbank rev-parse FETCH_HEAD)"
          SOURCE_TIMESTAMP="$(git -C build/formosanbank show -s --format=%cI "$SOURCE_COMMIT")"
          SOURCE_DATE="$(date --utc --date="$SOURCE_TIMESTAMP" +%Y%m%d)"
          RELEASE_ID="fb-${SOURCE_DATE}-${SOURCE_COMMIT:0:6}${GITHUB_SHA:0:6}"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved FormosanBank $SOURCE_REF to $SOURCE_COMMIT"
          echo "Resolved Kakarayan release identity $RELEASE_ID"

      - name: Require successful main CI before publication
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m publisher.github_release --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

      - name: Capture one public model catalogue
        run: |
          mkdir -p build/publication-inputs
          python - <<'PY'
          import json
          from pathlib import Path

          from publisher.model_catalog import build_model_catalog

          Path("build/publication-inputs/models.json").write_text(
              json.dumps(
                  build_model_catalog(),
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Transfer immutable publication inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-inputs-${{ github.run_id }}
          path: build/publication-inputs/models.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build and verify one complete release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      EXPECTED_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Require an approved software license for publication
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ ! -f LICENSE && ! -f LICENSE.md ]]; then
            echo "Data publication is disabled until maintainers add an approved software license."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Check out the exact public FormosanBank source
        run: |
          git init -q build/formosanbank
          git -C build/formosanbank remote add origin \
            https://github.com/FormosanBank/FormosanBank.git
          git -C build/formosanbank fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C build/formosanbank checkout --detach FETCH_HEAD

      - name: Download immutable publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: publication-inputs-${{ github.run_id }}
          path: build/publication-inputs

      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          uv run ruff check publisher
          uv run mypy publisher

      - name: Build the immutable publication
        run: |
          uv run python -m publisher.cli \
            --repo build/formosanbank \
            --output build/data-release \
            --source-commit "$SOURCE_COMMIT" \
            --kakarayan-commit "$GITHUB_SHA" \
            --model-catalog build/publication-inputs/models.json \
            --compress-database \
            --release-only \
            --profile build/build-profile.json

      - name: Record release ID
        id: release
        run: |
          RELEASE_ID="$(jq -r .release_id build/data-release/release-manifest.json)"
          if [[ "$RELEASE_ID" != "$EXPECTED_RELEASE_ID" ]]; then
            echo "Built $RELEASE_ID, expected $EXPECTED_RELEASE_ID."
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Validated $RELEASE_ID from FormosanBank $SOURCE_COMMIT"

      - name: Reproduce the complete publication
        if: ${{ inputs.verify_determinism }}
        run: |
          cp build/data-release/release-manifest.json \
            "$RUNNER_TEMP/first-release-manifest.json"
          rm -r -- build/data-release
          uv run python -m publisher.cli \
            --repo build/formosanbank \
            --output build/data-release \
            --source-commit "$SOURCE_COMMIT" \
            --kakarayan-commit "$GITHUB_SHA" \
            --model-catalog build/publication-inputs/models.json \
            --compress-database \
            --release-only \
            --profile build/reproduction-profile.json
          cmp "$RUNNER_TEMP/first-release-manifest.json" \
            build/data-release/release-manifest.json

      - name: Verify and reconcile the complete publication once
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          rights=()
          if [[ "$DRY_RUN" == "false" ]]; then
            rights=(--require-publishable-scope site-metadata
                    --require-publishable-scope release-core
                    --require-publishable-scope prepared-download)
          fi
          uv run python -m publisher.reconcile \
            --release build/data-release \
            --source-repo build/formosanbank \
            --database-output build/verified.sqlite \
            --max-artifact-mib 2048 \
            --profile build/reconciliation-profile.json \
            "${rights[@]}" | tee build/reconciliation.json

      - name: Benchmark the complete query release
        shell: bash
        run: |
          KAKARAYAN_DB_PATH=build/verified.sqlite \
          KAKARAYAN_RELEASE_MANIFEST_PATH=build/data-release/release-manifest.json \
          KAKARAYAN_REQUESTS_PER_MINUTE=60000 \
          KAKARAYAN_REQUEST_BURST=60000 \
          KAKARAYAN_EXPORTS_PER_MINUTE=60000 \
          KAKARAYAN_EXPORT_BURST=60000 \
            uv run uvicorn api.app:app \
              --host 127.0.0.1 --port 8000 --no-access-log \
              > "$RUNNER_TEMP/kakarayan-api.log" 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz > /dev/null; then
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/kakarayan-api.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/readyz
          uv run python -m api.benchmark \
            --base-url http://127.0.0.1:8000 \
            --cases tests/fixtures/query-benchmark.json \
            --output build/query-benchmark.json \
            --samples 30 \
            --network-profile "GitHub Actions loopback, full release"
          kill "$API_PID"
          wait "$API_PID" || true
          trap - EXIT
          rm -- build/verified.sqlite

      - name: Preserve query and publication measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: query-benchmark-${{ steps.release.outputs.release_id }}
          path: |
            build/query-benchmark.json
            build/reconciliation.json
            build/*-profile.json
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Remove the temporary source checkout
        run: rm -r -- build/formosanbank

      - name: Pack validated release output
        if: ${{ !inputs.dry_run }}
        run: |
          tar -C build/data-release -cf build/data-release.tar .
          rm -r -- build/data-release

      - name: Transfer validated release output
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-release-${{ steps.release.outputs.release_id }}
          path: build/data-release.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Create a draft GitHub data release
    if: ${{ !inputs.dry_run }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    environment:
      name: data-release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - name: Check out Kakarayan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Download the validated publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: data-release-${{ needs.build.outputs.release_id }}
          path: build

      - name: Extract and recheck the publication
        run: |
          mkdir -p build/data-release
          tar -C build/data-release -xf build/data-release.tar
          rm -- build/data-release.tar
          uv run python -m publisher.verify_release \
            --release build/data-release \
            --max-artifact-mib 2048 \
            --require-publishable-scope site-metadata \
            --require-publishable-scope release-core \
            --require-publishable-scope prepared-download

      - name: Upload or resume the immutable draft
        run: |
          uv run python -m publisher.github_release \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --release build/data-release
