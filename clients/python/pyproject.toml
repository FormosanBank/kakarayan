[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kakarayan-client"
version = "0.1.0"
description = "Dependency-free Python client for Kakarayan public APIs"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.10"

[project.scripts]
kakarayan = "kakarayan_client.cli:main"
