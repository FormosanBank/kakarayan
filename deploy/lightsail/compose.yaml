services:
  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    image: kakarayan-api:lightsail
    environment:
      KAKARAYAN_CORS_ORIGINS: ${KAKARAYAN_CORS_ORIGINS:?set KAKARAYAN_CORS_ORIGINS in .env}
      KAKARAYAN_QUERY_STEP_LIMIT: ${KAKARAYAN_QUERY_STEP_LIMIT:-2000000}
      KAKARAYAN_REQUESTS_PER_MINUTE: ${KAKARAYAN_REQUESTS_PER_MINUTE:-60}
      KAKARAYAN_REQUEST_BURST: ${KAKARAYAN_REQUEST_BURST:-20}
      KAKARAYAN_EXPORTS_PER_MINUTE: ${KAKARAYAN_EXPORTS_PER_MINUTE:-5}
      KAKARAYAN_EXPORT_BURST: ${KAKARAYAN_EXPORT_BURST:-5}
      KAKARAYAN_QUERY_CONCURRENCY: ${KAKARAYAN_QUERY_CONCURRENCY:-2}
      KAKARAYAN_QUERY_QUEUE_WAIT_SECONDS: ${KAKARAYAN_QUERY_QUEUE_WAIT_SECONDS:-1}
      KAKARAYAN_QUERY_TIMEOUT_SECONDS: ${KAKARAYAN_QUERY_TIMEOUT_SECONDS:-10}
      KAKARAYAN_DATASET_PREVIEW_TIMEOUT_SECONDS: ${KAKARAYAN_DATASET_PREVIEW_TIMEOUT_SECONDS:-15}
      KAKARAYAN_DATASET_EXPORT_TIMEOUT_SECONDS: ${KAKARAYAN_DATASET_EXPORT_TIMEOUT_SECONDS:-120}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:7860:7860"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: ${KAKARAYAN_API_MEMORY_LIMIT:-3g}

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      KAKARAYAN_HOSTNAME: ${KAKARAYAN_HOSTNAME:?set KAKARAYAN_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: ${KAKARAYAN_CADDY_MEMORY_LIMIT:-128m}

volumes:
  caddy_data:
  caddy_config:
