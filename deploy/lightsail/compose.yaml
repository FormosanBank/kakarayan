services:
  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    image: kakarayan-api:lightsail
    environment:
      KAKARAYAN_CORS_ORIGINS: ${KAKARAYAN_CORS_ORIGINS:?set KAKARAYAN_CORS_ORIGINS in .env}
      KAKARAYAN_QUERY_STEP_LIMIT: ${KAKARAYAN_QUERY_STEP_LIMIT:-2000000}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:7860:7860"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 448m

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      KAKARAYAN_HOSTNAME: ${KAKARAYAN_HOSTNAME:?set KAKARAYAN_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m

volumes:
  caddy_data:
  caddy_config:
