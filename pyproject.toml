[project]
name = "kakarayan"
version = "0.2.0"
description = "Publisher and read-only query service for the public FormosanBank corpus."
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
publisher = [
    "jsonschema>=4.23",
    "lxml>=5.0",
    "openpyxl>=3.1,<4",
    "pyarrow>=20,<26",
    "pycldf>=1.43,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9,<0.15",
    "mypy>=1.13",
    "httpx>=0.28,<1",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "--cov=api --cov=publisher --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modernise syntax for py313)
    "B",   # flake8-bugbear (likely bugs / bad practices)
]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
